[providers]
providers = ['php', 'node']

[phases.setup]
nixPkgs = ['php83', 'php83Extensions.pdo_mysql', 'php83Extensions.mbstring', 'composer', 'nodejs_22']

[phases.build]
cmds = [
  'composer install --no-dev --optimize-autoloader',
  'npm ci || npm install',
  'npm run build'
]

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'

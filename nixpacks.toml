[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_20"]

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader", "npm run build"]

[start]
cmd = "php artisan migrate --force || true; php artisan config:clear; php artisan route:clear; php artisan view:clear; php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
